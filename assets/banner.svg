<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.7; }
    }
    @keyframes syncPulse {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .pulsing-orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .pulsing-orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 950px 220px; }
    .sync-line { stroke-dasharray: 10, 15; animation: syncPulse 12s linear infinite; }
    .node-anim { animation: nodeBlink 3s ease-in-out infinite; }
    .node-anim-delayed { animation: nodeBlink 3.5s ease-in-out infinite 1.5s; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <g>
    <circle class="pulsing-orb-1" cx="250" cy="90" r="220" fill="url(#cyanOrb)"/>
    <circle class="pulsing-orb-2" cx="950" cy="240" r="240" fill="url(#purpleOrb)"/>
  </g>

  <!-- Background Animated Directory Connection Network Paths -->
  <g opacity="0.35">
    <path class="sync-line" d="M 50,180 Q 300,50 600,180 T 1150,180" fill="none" stroke="url(#lineGrad)" stroke-width="2"/>
    <path class="sync-line" d="M 50,220 Q 350,310 650,200 T 1150,200" fill="none" stroke="url(#lineGrad)" stroke-width="1.5" style="animation-direction: reverse;"/>
    
    <!-- Sync Graph Nodes -->
    <circle cx="160" cy="130" r="4" fill="#38bdf8" class="node-anim"/>
    <circle cx="340" cy="240" r="5" fill="#818cf8" class="node-anim-delayed"/>
    <circle cx="860" cy="120" r="5" fill="#38bdf8" class="node-anim-delayed"/>
    <circle cx="1040" cy="230" r="4" fill="#c084fc" class="node-anim"/>
  </g>

  <!-- Central Foreground Content Container (High Z-Index / Unobstructed) -->
  <g transform="translate(600, 155)" text-anchor="middle">
    <!-- Category Badge -->
    <g transform="translate(0, -95)">
      <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="-140" cy="0" r="4" fill="#38bdf8"/>
      <text x="0" y="4.5" fill="#93c5fd" font-size="11" font-weight="600" letter-spacing="1.5">HYBRID IDENTITY &amp; DIRECTORY SYNC</text>
    </g>

    <!-- Main Title -->
    <text y="-32" fill="url(#titleGrad)" font-size="36" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome Active Directory Sync</text>
    <text y="-32" fill="url(#titleGrad)" font-size="36" font-weight="800" letter-spacing="-0.5">Awesome Active Directory Sync</text>

    <!-- Subtitle / Tagline -->
    <text y="5" fill="#cbd5e1" font-size="15" font-weight="400" letter-spacing="0.2">Curated Enterprise Directory Synchronization • Hybrid Cloud Identity • SCIM &amp; LDAP</text>

    <!-- Feature Attribute Badges / Ecosystem Pills -->
    <g transform="translate(0, 52)">
      <!-- Pill 1: Active Directory -->
      <g transform="translate(-300, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="0" y="4.5" fill="#94a3b8" font-size="11.5" font-weight="500">🏢 Active Directory</text>
      </g>
      <!-- Pill 2: Entra ID / Okta -->
      <g transform="translate(-150, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="0" y="4.5" fill="#94a3b8" font-size="11.5" font-weight="500">☁️ Entra ID &amp; Okta</text>
      </g>
      <!-- Pill 3: SCIM Provisioning -->
      <g transform="translate(0, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="0" y="4.5" fill="#94a3b8" font-size="11.5" font-weight="500">🔄 SCIM 2.0 Engine</text>
      </g>
      <!-- Pill 4: OpenLDAP / 389ds -->
      <g transform="translate(150, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="0" y="4.5" fill="#94a3b8" font-size="11.5" font-weight="500">📁 LDAP Connectors</text>
      </g>
      <!-- Pill 5: Self-Hosted -->
      <g transform="translate(300, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="0" y="4.5" fill="#94a3b8" font-size="11.5" font-weight="500">⚡ Open Source</text>
      </g>
    </g>

    <!-- Bottom Stat Bar -->
    <g transform="translate(0, 105)">
      <line x1="-380" y1="0" x2="380" y2="0" stroke="#1e293b" stroke-width="1"/>
      <text x="-240" y="24" fill="#64748b" font-size="11" font-weight="500">SaaS Identity Suites</text>
      <text x="-70" y="24" fill="#64748b" font-size="11" font-weight="500">•</text>
      <text x="0" y="24" fill="#38bdf8" font-size="11" font-weight="600">Open-Source Sync Bridges</text>
      <text x="70" y="24" fill="#64748b" font-size="11" font-weight="500">•</text>
      <text x="240" y="24" fill="#64748b" font-size="11" font-weight="500">Password Hash &amp; Attribute Sync</text>
    </g>
  </g>
</svg>